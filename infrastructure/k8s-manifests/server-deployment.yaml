apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: server
  name: server
  namespace: blnk
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: server
    spec:
      containers:
        - args:
            - blnk migrate up --config /blnk.json && blnk start --config /blnk.json
          command:
            - /bin/sh
            - -c
          env:
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: TZ
              value: Etc/UTC
            - name: BLNK_SERVER_SECURE
              value: "true"
            - name: BLNK_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blnk-secrets
                  key: server-secret-key
            - name: BLNK_DATA_SOURCE_DNS
              valueFrom:
                secretKeyRef:
                  name: blnk-secrets
                  key: data-source-dns
          image: jerryenebeli/blnk:0.13.3
          name: server
          ports:
            - containerPort: 5001
          resources: {}
          volumeMounts:
            - name: blnk-config
              mountPath: /blnk.json
              subPath: blnk.json
      restartPolicy: Always
      volumes:
        - name: blnk-config
          configMap:
            name: blnk-config
status: {} 