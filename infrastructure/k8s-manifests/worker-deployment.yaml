apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
    kompose.version: 1.26.1 (a9d05d509)
  creationTimestamp: null
  labels:
    io.kompose.service: worker
  name: worker
  namespace: blnk
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worker
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s-manifests/
        kompose.version: 1.26.1 (a9d05d509)
      creationTimestamp: null
      labels:
        io.kompose.service: worker
    spec:
      containers:
        - command:
            - blnk
            - workers
            - --config
            - /blnk.json
          env:
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: BLNK_SERVER_SECURE
              value: "true"
            - name: BLNK_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blnk-secrets
                  key: server-secret-key
            - name: BLNK_DATA_SOURCE_DNS
              valueFrom:
                secretKeyRef:
                  name: blnk-secrets
                  key: data-source-dns
          image: jerryenebeli/blnk:0.13.3
          name: worker
          ports:
            - containerPort: 5004
          resources: {}
          volumeMounts:
            - name: blnk-config
              mountPath: /blnk.json
              subPath: blnk.json
      restartPolicy: Always
      volumes:
        - name: blnk-config
          configMap:
            name: blnk-config
