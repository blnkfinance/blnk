# Fill these values before apply. Empty values are intentional.
# The API process refuses to start without server-secret-key, and Postgres
# refuses an empty password. data-source-dns must use the same password:
#
#   kubectl -n blnk create secret generic blnk-secrets \
#     --from-literal=server-secret-key="$(openssl rand -hex 32)" \
#     --from-literal=postgres-password="$(openssl rand -hex 24)" \
#     --from-literal=data-source-dns='postgres://postgres:THE_SAME_PASSWORD@postgres:5432/blnk?sslmode=disable' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Re-applying this file overwrites a live secret with empty values.
apiVersion: v1
kind: Secret
metadata:
  name: blnk-secrets
  namespace: blnk
type: Opaque
stringData:
  server-secret-key: ""
  postgres-password: ""
  data-source-dns: ""
