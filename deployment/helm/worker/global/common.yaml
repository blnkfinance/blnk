# Global baseline configuration for the blnk worker (async queue processor)
# shared across every country/environment.
#
# environment variable available for substitution
# _ns: namespace, for example - `beauto` for MX BEAUTO, or `dev`/`qa`/`stage`
# _env: environment, for example - `dev`, `qa`, `beauto`, `stage`, `prod`
# _country: country code, for example - `mx`
# _market_hub: regional data hub the country's shared infra lives under

serviceAccount:
  name: "${_country}-${_env}-blnk-worker"
  create: true

nameOverride: "${_ns}-blnk-worker"
fullnameOverride: "${_ns}-blnk-worker"

persistence:
  enabled: false

# Healthchecks - worker exposes /health on its monitoring port
livenessProbe:
  path: /health
  port: 5004
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 15

readinessProbe:
  path: /health
  port: 5004
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 15

opentelemetry:
  enabled: false

datadogAPM:
  enabled: false
application:
  enabled: false
instanaAPM:
  enabled: false

antiAffinity: "soft"
cliHealthCheck:
  enabled: false

# Container - worker has no external app traffic; /health and /metrics live
# on its monitoring port (BLNK_QUEUE_MONITORING_PORT)
containerPort: 5004
adminPort: 5004

image:
  repository: 004384079765.dkr.ecr.us-west-2.amazonaws.com/blnk-worker
  tag: latest
  pullPolicy: IfNotPresent

tolerations: []

affinity: {}

# No external traffic to the worker
ingress:
  enabled: false

prometheus:
  enabled: true
  path: /metrics
  interval: 30s
  portname: app

hpa:
  enabled: true
hpav2:
  enabled: true

scalingMetrics:
  targetCPUUtilizationPercentage: 90

scalingMetricsMemory:
  targetMemoryUtilization: 90

scalingBehaviour: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  fsGroup: 10001
  runAsUser: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 5004

environmentShort: ${_env}
environmentFull: ${_env}

env:
  TZ: Etc/UTC
  BLNK_QUEUE_MONITORING_PORT: "5004"
  BLNK_PROJECT_NAME: "Blnk"

secretEnv:
  DB_USER:
    name: blnk-postgres-secret
    key: username
  DB_PASSWORD:
    name: blnk-postgres-secret
    key: password
  BLNK_TYPESENSE_KEY:
    name: blnk-typesense-secret
    key: api_key

externalSecretsMap:
  blnk-postgres-secret:
    country: ${_country}
    env: ${_env}
  blnk-redis-secret:
    country: ${_country}
    env: ${_env}
  blnk-typesense-secret:
    country: ${_country}
    env: ${_env}
